# 战士默认挂机 Profile
# 适用:近战拉扯,站前排,AOE 旋风斩
id: warrior-default
name: 战士·默认挂机
game: qqfantasy
version: 1
description: |
  近战战士挂机模板,前排拉扯,AOE 群攻。
  适配 QQ幻想 战士职业通用场景。

# 大漠绑定(老游戏 GDI 最稳)
engine:
  display: gdi
  mouse: windows
  keypad: windows
  mode: 0

# UI 区域(屏幕坐标,根据实际分辨率调整)
regions:
  minimap:
    x: 1700
    y: 0
    w: 220
    h: 220
  selfHp:
    x: 60
    y: 50
    w: 200
    h: 30
  selfMp:
    x: 60
    y: 90
    w: 200
    h: 30
  targetHp:
    x: 800
    y: 100
    w: 200
    h: 20
  skillBar:
    x: 700
    y: 900
    w: 500
    h: 80
  chat:
    x: 0
    y: 600
    w: 400
    h: 200

# 字库(从 ffo-auto-script 复制,游戏内文字识别)
fontLib: ./assets/font/0_ffo.txt

# 模板图片(P4 玩家自行截图制作)
templates:
  mobNormal: ./assets/templates/mob_normal.png
  mobElite: ./assets/templates/mob_elite.png
  playerArrow: ./assets/templates/player_arrow.png
  dropWhite: ./assets/templates/drop_white.png

# 职业 + 技能
class:
  name: 战士
  attackType: melee
  combatStyle: pull
  idealDistance: 3
  movementSpeed: 200

  skills:
    F1:
      name: 普攻
      type: basic
      cooldownMs: 500
      priority: 1
    F2:
      name: 冲撞
      type: gap_close
      cooldownMs: 8000
      priority: 6
      condition:
        type: distance
        op: greater_than
        value: 5
    F3:
      name: 旋风斩
      type: aoe
      cooldownMs: 12000
      priority: 8
      condition:
        type: nearbyMobs
        op: at_least
        value: 3
    F4:
      name: 嘲讽
      type: threat
      cooldownMs: 30000
      priority: 5
      condition:
        type: selfHp
        op: less_than
        value: 50
    F5:
      name: 暴怒(回血)
      type: heal
      cooldownMs: 60000
      priority: 100
      condition:
        type: selfHp
        op: less_than
        value: 30
      interruptible: true
      preemptedBy: [F5]
    F8:
      name: 战吼(攻击 buff)
      type: buff
      cooldownMs: 60000
      priority: 4
      condition:
        type: onCombatStart
        op: equal
        value: true

  potions:
    Q:
      type: hp_potion
      trigger:
        type: selfHp
        op: less_than
        value: 60
    W:
      type: mp_potion
      trigger:
        type: selfMp
        op: less_than
        value: 30
    R:
      type: emergency_teleport
      trigger:
        type: selfHp
        op: less_than
        value: 15

# 战斗策略
combat:
  approachDistance: 8
  combatTimeoutMs: 60000
  healThreshold: 40
  escapeThreshold: 15
  kiteDistance: 12
  findTargetRange: 400
  findTargetIntervalMs: 1500
  mobFilter:
    minLevel: 1
    maxLevel: 50
    colorFilter: [white, yellow, red]

# 挂机配置
farm:
  farmSpot:
    x: 1234
    y: 5678
  returnThreshold: 8
  resupply:
    hpPotionThreshold: 50
    mpPotionThreshold: 30

# 启用任务
tasks: [farm]
