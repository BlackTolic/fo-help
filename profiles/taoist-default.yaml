# 道士默认挂机 Profile
id: taoist-default
name: 道士·默认挂机
game: qqfantasy
version: 1
description: |
  道士挂机模板,召唤宝宝+毒+治疗,慢但稳。
  适配 QQ幻想 道士职业通用场景。

engine:
  display: gdi
  mouse: windows
  keypad: windows
  mode: 0

regions:
  minimap:
    x: 1700
    y: 0
    w: 220
    h: 220
  selfHp:
    x: 60
    y: 50
    w: 200
    h: 30
  selfMp:
    x: 60
    y: 90
    w: 200
    h: 30
  targetHp:
    x: 800
    y: 100
    w: 200
    h: 20
  skillBar:
    x: 700
    y: 900
    w: 500
    h: 80
  chat:
    x: 0
    y: 600
    w: 400
    h: 200

fontLib: ./assets/font/0_ffo.txt

templates:
  mobNormal: ./assets/templates/mob_normal.png
  mobElite: ./assets/templates/mob_elite.png
  playerArrow: ./assets/templates/player_arrow.png
  dropWhite: ./assets/templates/drop_white.png

class:
  name: 道士
  attackType: ranged
  combatStyle: backline
  idealDistance: 6
  movementSpeed: 250

  skills:
    F1:
      name: 普攻
      type: basic
      cooldownMs: 500
      priority: 1
    F2:
      name: 施毒术
      type: basic
      cooldownMs: 5000
      priority: 7
      condition:
        type: inCombat
        op: equal
        value: true
    F3:
      name: 召唤宝宝
      type: utility
      cooldownMs: 30000
      priority: 100
      condition:
        type: onCombatStart
        op: equal
        value: true
    F4:
      name: 灵魂火符
      type: basic
      cooldownMs: 2000
      priority: 6
    F5:
      name: 群毒
      type: aoe
      cooldownMs: 15000
      priority: 7
      condition:
        type: nearbyMobs
        op: at_least
        value: 3
    F8:
      name: 治疗术
      type: heal
      cooldownMs: 5000
      priority: 100
      condition:
        type: selfHp
        op: less_than
        value: 60
      interruptible: true

  potions:
    Q:
      type: hp_potion
      trigger:
        type: selfHp
        op: less_than
        value: 65
    W:
      type: mp_potion
      trigger:
        type: selfMp
        op: less_than
        value: 30
    E:
      type: buff
      trigger:
        type: onCombatStart
        op: equal
        value: true
    R:
      type: emergency_teleport
      trigger:
        type: selfHp
        op: less_than
        value: 20

combat:
  approachDistance: 10
  combatTimeoutMs: 70000
  healThreshold: 55
  escapeThreshold: 18
  kiteDistance: 14
  findTargetRange: 400
  findTargetIntervalMs: 1500
  mobFilter:
    minLevel: 1
    maxLevel: 50
    colorFilter: [white, yellow, red]

farm:
  farmSpot:
    x: 1234
    y: 5678
  returnThreshold: 10
  resupply:
    hpPotionThreshold: 45
    mpPotionThreshold: 25

tasks: [farm]
