      name: 魔法盾
      type: buff
      cooldownMs: 30000
      priority: 100
      condition:
        type: selfHp
        op: less_than
        value: 60
      interruptible: true
    F8:
      name: 治疗
      type: heal
      cooldownMs: 30000
      priority: 99
      condition:
        type: selfHp
        op: less_than
        value: 35

