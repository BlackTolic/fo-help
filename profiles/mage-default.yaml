# 法师默认挂机 Profile
id: mage-default
name: 法师·默认挂机
game: qqfantasy
version: 1
description: |
  远攻法师挂机模板,后排输出,AOE 群攻。
  适配 QQ幻想 法师职业通用场景。

engine:
